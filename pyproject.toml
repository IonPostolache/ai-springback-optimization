[project]
name = "ai-springback-optimization"
version = "0.1.0"
description = "AI-assisted robust sheet-metal ai-springback optimization: parametric CAD, closed-form springback physics under Monte Carlo uncertainty, ML surrogate, LLM at the edges."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "build123d>=0.7",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pydantic>=2.6",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physics", "cad", "search", "llm", "surrogate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
